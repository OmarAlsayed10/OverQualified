name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: overqualified_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d overqualified_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: BACKEND
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/overqualified_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run db:preflight
      - run: npm test -- --runInBand --silent
      - run: bash -n ops/backup-database.sh ops/restore-database.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
